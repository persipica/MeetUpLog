spring:
  application:
    name: meetuplog

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/meetuplog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

server:
  port: 8080