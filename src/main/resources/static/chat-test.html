<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>채팅 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #chatBox { width: 450px; height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .msg { margin: 5px 0; padding: 4px 8px; border-radius: 4px; background: #fff; border: 1px solid #eee; }
    </style>
</head>
<body>
<h2>💬 실시간 모임방 채팅 테스트</h2>

<div>
    <label>방 번호: <input type="number" id="roomId" value="2" style="width: 50px;"></label>
    <label>닉네임: <input type="text" id="nickname" value="방장유저" style="width: 80px;"></label>
    <label>유저 ID: <input type="number" id="userId" value="5" style="width: 50px;"></label>
    <button id="btnConnect" onclick="connect()">연결하기</button>
    <button id="btnDisconnect" onclick="disconnect()" disabled>연결 끊기</button>
</div>
<br>

<div id="chatBox"></div>

<div>
    <input type="text" id="messageInput" placeholder="메시지를 입력하세요" style="width: 350px;" onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">전송</button>
</div>

<script>
    let stompClient = null;

    function connect() {
        const roomId = document.getElementById('roomId').value;
        const nickname = document.getElementById('nickname').value;
        const userId = document.getElementById('userId').value;

        // 기존 채팅창 비우기
        document.getElementById('chatBox').innerHTML = '';

        stompClient = new StompJs.Client({
            brokerURL: 'ws://localhost:8080/ws-chat',
            onConnect: () => {
                document.getElementById('btnConnect').disabled = true;
                document.getElementById('btnDisconnect').disabled = false;
                appendLog("System", "서버에 연결되었습니다.");

                // 0. DB에 저장된 이전 대화 내역 불러오기
                fetch('/api/v1/rooms/' + roomId + '/messages')
                    .then(res => res.json())
                    .then(messages => {
                        if (Array.isArray(messages)) {
                            messages.forEach(msg => {
                                const sender = msg.senderNickname ? msg.senderNickname : (msg.senderId ? `유저${msg.senderId}` : 'System');
                                appendLog(sender, msg.content);
                            });
                        }
                    })
                    .catch(err => console.error("이전 대화 불러오기 실패:", err));

                // 1. 방 실시간 구독 (/sub/room/{roomId})
                stompClient.subscribe('/sub/room/' + roomId, (message) => {
                    const body = JSON.parse(message.body);
                    appendLog(body.senderNickname || 'System', body.content);
                });

                // 2. 입장 메시지 발행 (/pub/chat/message)
                stompClient.publish({
                    destination: '/pub/chat/message',
                    body: JSON.stringify({
                        messageType: 'SYSTEM',
                        roomId: Number(roomId),
                        senderId: Number(userId),
                        senderNickname: nickname,
                        content: ''
                    })
                });
            },
            onStompError: (frame) => {
                appendLog("Error", frame.headers['message']);
            }
        });

        stompClient.activate();
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.deactivate();
        }
        document.getElementById('btnConnect').disabled = false;
        document.getElementById('btnDisconnect').disabled = true;
        appendLog("System", "연결이 종료되었습니다.");
    }

    function sendMessage() {
        const roomId = document.getElementById('roomId').value;
        const nickname = document.getElementById('nickname').value;
        const userId = document.getElementById('userId').value;
        const messageInput = document.getElementById('messageInput');

        if (messageInput.value.trim() !== '' && stompClient) {
            stompClient.publish({
                destination: '/pub/chat/message',
                body: JSON.stringify({
                    messageType: 'TEXT',
                    roomId: Number(roomId),
                    senderId: Number(userId),
                    senderNickname: nickname,
                    content: messageInput.value
                })
            });
            messageInput.value = '';
        }
    }

    function appendLog(sender, message) {
        if (!message) return;
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<strong>${sender}:</strong> ${message}`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
